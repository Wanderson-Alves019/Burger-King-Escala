<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta de Vendas - Burger King</title>
<link rel="icon" href="assets/images/LOGO BK.png" type="image/png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

  :root {
    --bk-beige: #F5EBDC;
    --bk-brown: #502314;
    --bk-orange: #FF8732;
    --bk-red: #D62300;
    --bk-yellow: #FFD700;
    --bk-green: #007A33;
    --bk-teal: #00A3A1;
    --bk-dark: #32140A;
    --bk-cream: #FFF8EF;
    --bk-light-orange: #FFA35C;
    --bk-light-red: #FF4433;
    --shadow-soft: 0 8px 32px rgba(80, 35, 20, 0.12);
    --shadow-medium: 0 12px 40px rgba(80, 35, 20, 0.18);
    --shadow-strong: 0 16px 48px rgba(80, 35, 20, 0.25);
    --radius: 18px;
    --radius-sm: 12px;
    --radius-lg: 24px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bk-beige);
    color: var(--bk-brown);
    padding: 30px;
    line-height: 1.6;
    position: relative;
    overflow-x: hidden;
  }

  /* Padrão de fundo sutil BK */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(circle at 20% 20%, rgba(255, 135, 50, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(214, 35, 0, 0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1050px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, var(--bk-brown) 0%, var(--bk-dark) 100%);
    padding: 28px 40px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-strong);
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255, 135, 50, 0.15) 0%, transparent 70%);
    border-radius: 50%;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -40%;
    left: -10%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
    border-radius: 50%;
  }

  .header-info {
    position: relative;
    z-index: 2;
  }

  .header-info p {
    color: var(--bk-orange);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .header-info h1 {
    font-size: 36px;
    color: white;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 900;
    line-height: 1.1;
  }

  .header-info h1 span {
    color: var(--bk-yellow);
  }

  .bk-logo { 
    width: 110px;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
  }

  /* MAIN CONTENT */
  .main-content {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-medium);
    padding: 45px;
    border: none;
    position: relative;
    overflow: hidden;
  }

  .main-content::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--bk-red), var(--bk-orange), var(--bk-yellow), var(--bk-orange), var(--bk-red));
  }

  /* FORM SECTION */
  .form-section {
    margin-bottom: 40px;
  }

  .form-section h2 {
    font-size: 17px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--bk-brown);
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 3px solid transparent;
    border-image: linear-gradient(90deg, var(--bk-orange), var(--bk-yellow)) 1;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .form-section h2 .icon {
    font-size: 22px;
  }

  .form-group {
    margin-bottom: 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .form-group.full {
    grid-template-columns: 1fr;
  }

  .input-wrapper {
    display: flex;
    flex-direction: column;
  }

  .input-wrapper label {
    font-weight: 700;
    color: var(--bk-brown);
    margin-bottom: 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .input-wrapper input,
  .input-wrapper select {
    padding: 14px 18px;
    border: 2px solid #E8DDD0;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s ease;
    background: #FAFAFA;
    font-weight: 500;
  }

  .input-wrapper input::placeholder {
    color: #B8A99A;
    font-weight: 400;
  }

  .input-wrapper input:focus,
  .input-wrapper select:focus {
    outline: none;
    border-color: var(--bk-orange);
    background: white;
    box-shadow: 0 0 0 4px rgba(255, 135, 50, 0.12);
  }

  .input-wrapper input[type="number"] {
    font-size: 17px;
    font-weight: 600;
  }

  /* TAX SELECTOR */
  .tax-selector {
    display: flex;
    gap: 16px;
    margin-top: 10px;
  }

  .tax-option {
    flex: 1;
    padding: 20px;
    border: 2px solid #E8DDD0;
    border-radius: var(--radius);
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: #FAFAFA;
    position: relative;
    overflow: hidden;
  }

  .tax-option::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255, 135, 50, 0.05) 0%, transparent 100%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .tax-option:hover {
    border-color: var(--bk-orange);
    background: white;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 135, 50, 0.12);
  }

  .tax-option:hover::before {
    opacity: 1;
  }

  .tax-option input[type="radio"] {
    display: none;
  }

  .tax-option.active {
    background: linear-gradient(135deg, var(--bk-orange) 0%, var(--bk-light-orange) 100%);
    border-color: var(--bk-orange);
    box-shadow: 0 8px 24px rgba(255, 135, 50, 0.3);
    transform: translateY(-2px);
  }

  .tax-option.active::before {
    opacity: 0;
  }

  .tax-label {
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    color: var(--bk-brown);
    display: block;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    position: relative;
    z-index: 1;
  }

  .tax-value {
    font-size: 22px;
    font-weight: 800;
    color: var(--bk-brown);
    position: relative;
    z-index: 1;
  }

  .tax-option.active .tax-label,
  .tax-option.active .tax-value {
    color: white;
  }

  /* RESULTS SECTION */
  .results-section {
    background: linear-gradient(180deg, #FEFCFA 0%, #FFF8EF 100%);
    border-radius: var(--radius);
    padding: 35px;
    border: 2px solid #F0E6D8;
    margin-top: 40px;
    position: relative;
  }

  .results-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(circle at 10% 50%, rgba(255, 135, 50, 0.04) 0%, transparent 40%),
      radial-gradient(circle at 90% 30%, rgba(214, 35, 0, 0.03) 0%, transparent 40%);
    pointer-events: none;
    border-radius: inherit;
  }

  .results-section h2 {
    font-size: 17px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--bk-brown);
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 3px solid transparent;
    border-image: linear-gradient(90deg, var(--bk-green), var(--bk-teal)) 1;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-top: 20px;
    position: relative;
    z-index: 1;
  }

  .result-card {
    background: white;
    padding: 24px 20px;
    border-radius: var(--radius-sm);
    border-left: 5px solid var(--bk-orange);
    box-shadow: 0 4px 16px rgba(80, 35, 20, 0.08);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .result-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, rgba(255, 135, 50, 0.06) 0%, transparent 100%);
    border-radius: 0 0 0 100%;
  }

  .result-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(80, 35, 20, 0.14);
  }

  .result-card.success {
    border-left-color: var(--bk-green);
  }

  .result-card.success::before {
    background: linear-gradient(135deg, rgba(0, 122, 51, 0.06) 0%, transparent 100%);
  }

  .result-card.alert {
    border-left-color: var(--bk-red);
  }

  .result-card.alert::before {
    background: linear-gradient(135deg, rgba(214, 35, 0, 0.06) 0%, transparent 100%);
  }

  .result-card.info {
    border-left-color: var(--bk-teal);
  }

  .result-card.info::before {
    background: linear-gradient(135deg, rgba(0, 163, 161, 0.06) 0%, transparent 100%);
  }

  .result-label {
    font-size: 10px;
    text-transform: uppercase;
    color: #9A8B7B;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: 1.2px;
    position: relative;
    z-index: 1;
  }

  .result-value {
    font-size: 26px;
    font-weight: 800;
    color: var(--bk-brown);
    position: relative;
    z-index: 1;
    letter-spacing: -0.5px;
  }

  .result-card.success .result-value {
    color: var(--bk-green);
  }

  .result-card.alert .result-value {
    color: var(--bk-red);
  }

  .result-card.info .result-value {
    color: var(--bk-teal);
  }

  /* BUTTONS */
  .button-group {
    display: flex;
    gap: 16px;
    margin-top: 35px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 16px 32px;
    border: none;
    border-radius: 50px;
    font-weight: 800;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 13px;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    font-family: 'Poppins', sans-serif;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.8px;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
  }

  .btn:hover::before {
    left: 100%;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--bk-orange) 0%, var(--bk-red) 100%);
    color: white;
  }

  .btn-primary:hover {
    background: linear-gradient(135deg, var(--bk-red) 0%, var(--bk-orange) 100%);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(214, 35, 0, 0.35);
  }

  .btn-secondary {
    background: linear-gradient(135deg, var(--bk-green) 0%, var(--bk-teal) 100%);
    color: white;
  }

  .btn-secondary:hover {
    background: linear-gradient(135deg, var(--bk-teal) 0%, var(--bk-green) 100%);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0, 122, 51, 0.35);
  }

  .btn-print {
    background: linear-gradient(135deg, var(--bk-green) 0%, var(--bk-teal) 100%);
    color: white;
  }

  .btn-print:hover {
    background: linear-gradient(135deg, var(--bk-teal) 0%, var(--bk-green) 100%);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0, 122, 51, 0.35);
  }

  .btn-reset {
    background: linear-gradient(135deg, #9A8B7B 0%, #7A6B5B 100%);
    color: white;
  }

  .btn-reset:hover {
    background: linear-gradient(135deg, #7A6B5B 0%, #5A4B3B 100%);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(90, 75, 59, 0.3);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* PRINT STYLES */
  @media print {
    @page { size: A4; margin: 10mm; }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    body { padding: 0 !important; margin: 0 !important; background: white !important; }
    .container { width: 100% !important; max-width: none !important; }
    .header { padding: 15px !important; margin-bottom: 20px !important; border-radius: 10px !important; }
    .header-info h1 { font-size: 20pt !important; }
    .bk-logo { width: 60px !important; }
    .main-content { padding: 20px !important; }
    .form-section { display: none !important; }
    .button-group { display: none !important; }
    .results-section { background: white !important; border: 1px solid #ddd !important; padding: 20px !important; }
    .results-grid { gap: 15px !important; }
    .result-card { padding: 15px !important; }
    .result-label { font-size: 9pt !important; }
    .result-value { font-size: 18pt !important; }
    .btn-voltar-portal { display: none !important; }
    body::before { display: none !important; }
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    body { padding: 15px; }
    .form-group {
      grid-template-columns: 1fr;
    }
    .header {
      flex-direction: column;
      gap: 20px;
      text-align: center;
      padding: 25px 20px;
    }
    .header-info h1 {
      font-size: 26px;
    }
    .main-content {
      padding: 25px;
    }
    .results-grid {
      grid-template-columns: 1fr;
    }
    .button-group {
      flex-direction: column;
    }
    .btn {
      width: 100%;
      justify-content: center;
    }
    .tax-selector {
      flex-direction: column;
    }
  }

  /* Estilo do Botão Voltar ao Portal */
  .btn-voltar-portal {
    position: fixed;
    top: 15px;
    left: 15px;
    background: linear-gradient(135deg, var(--bk-brown) 0%, var(--bk-dark) 100%);
    color: var(--bk-cream);
    padding: 8px 16px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 700;
    font-size: 11px;
    z-index: 10000;
    box-shadow: 0 4px 16px rgba(50, 20, 10, 0.3);
    display: flex;
    align-items: center;
    gap: 8px;
    border: 2px solid var(--bk-orange);
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .btn-voltar-portal:hover {
    background: linear-gradient(135deg, var(--bk-red) 0%, var(--bk-brown) 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(214, 35, 0, 0.4);
  }

  .btn-voltar-portal img {
    width: 20px;
    height: 20px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }

  @media print {
    .btn-voltar-portal {
      display: none !important;
    }
  }

</style>
</head>
<body>

    <!-- Botão Voltar ao Portal -->
    <a href="gestao_escala.html" class="btn-voltar-portal">
        <img src="assets/images/LOGO BK.png" alt="BK">
        <span>Portal</span>
    </a>

    <div class="container">
        <div class="header">
            <div class="header-info">
                <p>Gestão de Vendas</p>
                <h1>Meta de <span>Vendas</span></h1>
            </div>
            <img src="assets/images/LOGO BK.png" class="bk-logo" alt="BK">
        </div>

        <div class="main-content">
            <!-- FORM SECTION -->
            <div class="form-section">
                <h2>Informações de Vendas</h2>
                
                <div class="form-group">
                    <div class="input-wrapper">
                        <label for="metaVendas">Meta de Vendas (R$)</label>
                        <input type="number" id="metaVendas" placeholder="Ex: 10000" step="0.01" min="0">
                    </div>
                    <div class="input-wrapper">
                        <label for="vendidoVendas">Vendido até Agora (R$)</label>
                        <input type="number" id="vendidoVendas" placeholder="Ex: 7500" step="0.01" min="0">
                    </div>
                </div>

                <div class="form-section">
                    <h2>Percentual de Impostos</h2>
                    <div class="tax-selector">
                        <label class="tax-option active" id="tax-145">
                            <input type="radio" name="taxPercentage" value="14.5" checked onchange="calcularMeta()">
                            <span class="tax-label">14,5% de Impostos</span>
                            <span class="tax-value">÷ 0,855</span>
                        </label>
                        <label class="tax-option" id="tax-15">
                            <input type="radio" name="taxPercentage" value="15" onchange="calcularMeta()">
                            <span class="tax-label">15% de Impostos</span>
                            <span class="tax-value">÷ 0,85</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- RESULTS SECTION -->
            <div class="results-section">
                <h2>Resultados</h2>
                <div class="results-grid">
                    <div class="result-card info">
                        <div class="result-label">Meta Sem Impostos</div>
                        <div class="result-value" id="metaSemImpostos">R$ 0,00</div>
                    </div>
                    <div class="result-card info">
                        <div class="result-label">Meta Com Impostos</div>
                        <div class="result-value" id="metaComImpostos">R$ 0,00</div>
                    </div>
                    <div class="result-card">
                        <div class="result-label">Já Vendido</div>
                        <div class="result-value" id="jaVendido">R$ 0,00</div>
                    </div>
                    <div class="result-card alert" id="faltaSemCard">
                        <div class="result-label">Falta (Sem Impostos)</div>
                        <div class="result-value" id="faltaSemImpostos">R$ 0,00</div>
                    </div>
                    <div class="result-card alert" id="faltaComCard">
                        <div class="result-label">Falta (Com Impostos)</div>
                        <div class="result-value" id="faltaComImpostos">R$ 0,00</div>
                    </div>
                    <div class="result-card success" id="percentualCard">
                        <div class="result-label">Percentual Atingido</div>
                        <div class="result-value" id="percentualAtingido">0%</div>
                    </div>
                </div>
            </div>

            <!-- BUTTONS -->
            <div class="button-group">
                <button class="btn btn-primary" onclick="calcularMeta()">
                    Calcular
                </button>
                <button class="btn btn-secondary" onclick="window.print()">
                    Imprimir
                </button>
                <button class="btn btn-reset" onclick="limparFormulario()">
                    Limpar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Atualizar classe ativa ao mudar seleção de impostos
        document.querySelectorAll('input[name="taxPercentage"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.querySelectorAll('.tax-option').forEach(opt => opt.classList.remove('active'));
                if (this.value === '14.5') {
                    document.getElementById('tax-145').classList.add('active');
                } else {
                    document.getElementById('tax-15').classList.add('active');
                }
                calcularMeta();
            });
        });

        // Calcular meta ao digitar
        document.getElementById('metaVendas').addEventListener('input', calcularMeta);
        document.getElementById('vendidoVendas').addEventListener('input', calcularMeta);

        function calcularMeta() {
            const metaVendas = parseFloat(document.getElementById('metaVendas').value) || 0;
            const vendidoVendas = parseFloat(document.getElementById('vendidoVendas').value) || 0;
            const taxPercentage = parseFloat(document.querySelector('input[name="taxPercentage"]:checked').value);
            
            // Calcular divisor baseado no percentual
            const divisor = 1 - (taxPercentage / 100);
            
            // Meta com impostos (dividir por 0,855 ou 0,85)
            const metaComImpostos = metaVendas / divisor;
            
            // Falta
            const faltaSemImpostos = Math.max(0, metaVendas - vendidoVendas);
            const faltaComImpostos = Math.max(0, metaComImpostos - vendidoVendas);
            
            // Percentual atingido
            const percentualAtingido = metaVendas > 0 ? (vendidoVendas / metaVendas) * 100 : 0;
            
            // Atualizar resultados
            document.getElementById('metaSemImpostos').textContent = formatarMoeda(metaVendas);
            document.getElementById('metaComImpostos').textContent = formatarMoeda(metaComImpostos);
            document.getElementById('jaVendido').textContent = formatarMoeda(vendidoVendas);
            document.getElementById('faltaSemImpostos').textContent = formatarMoeda(faltaSemImpostos);
            document.getElementById('faltaComImpostos').textContent = formatarMoeda(faltaComImpostos);
            document.getElementById('percentualAtingido').textContent = percentualAtingido.toFixed(1) + '%';
            
            // Atualizar cores dos cards
            const faltaSemCard = document.getElementById('faltaSemCard');
            const faltaComCard = document.getElementById('faltaComCard');
            const percentualCard = document.getElementById('percentualCard');
            
            faltaSemCard.classList.remove('success', 'alert');
            faltaComCard.classList.remove('success', 'alert');
            percentualCard.classList.remove('success', 'alert');
            
            if (faltaSemImpostos <= 0) {
                faltaSemCard.classList.add('success');
            } else {
                faltaSemCard.classList.add('alert');
            }
            
            if (faltaComImpostos <= 0) {
                faltaComCard.classList.add('success');
            } else {
                faltaComCard.classList.add('alert');
            }
            
            if (percentualAtingido >= 100) {
                percentualCard.classList.add('success');
            } else if (percentualAtingido >= 75) {
                percentualCard.classList.add('alert');
            }
        }

        function formatarMoeda(valor) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(valor);
        }

        function limparFormulario() {
            document.getElementById('metaVendas').value = '';
            document.getElementById('vendidoVendas').value = '';
            document.getElementById('tax-145').classList.add('active');
            document.getElementById('tax-15').classList.remove('active');
            document.querySelector('input[value="14.5"]').checked = true;
            calcularMeta();
        }

        // Calcular ao carregar a página
        window.addEventListener('load', calcularMeta);
    </script>

</body>
